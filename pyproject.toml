[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citysurfaces"
version = "1.0.0"
description = "City Surfaces semantic segmentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
    "numpy",
    "pandas",
    "runx",
    "matplotlib",
    "tensorboardX",
    "coolname",
    "pyyaml", 
    "pillow"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["*.Zone.Identifier"]
